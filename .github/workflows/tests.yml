name: Tests

# On main, these run as the first step of the Deploy workflow (which only publishes if they
# pass); on other branches and pull requests they run on their own.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Answer checking
        run: node tests/answer_test.mjs && node tests/mnemonics_test.mjs
      - name: Browser end-to-end
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python -m http.server 8000 &
          sleep 1
          python tests/e2e.py http://localhost:8000/
          python tests/wanikani_test.py http://localhost:8000/
          python tests/peek_test.py http://localhost:8000/
          python tests/lesson_order_test.py http://localhost:8000/
          python tests/retry_test.py http://localhost:8000/
          python tests/hint_test.py http://localhost:8000/
